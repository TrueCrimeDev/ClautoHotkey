name: AHK advanced patterns

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v2.0.26
            mode: download
            url: https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip
          - label: v2.1-alpha.30
            mode: build
            ref: v2.1-alpha.30

    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out AutoHotkey source
        if: matrix.mode == 'build'
        uses: actions/checkout@v4
        with:
          repository: AutoHotkey/AutoHotkey
          ref: ${{ matrix.ref }}
          path: autohotkey-src

      - name: Download stable interpreter
        if: matrix.mode == 'download'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "autohotkey-${{ matrix.label }}.zip"
          $dir = Join-Path $env:RUNNER_TEMP "autohotkey-${{ matrix.label }}"
          & curl.exe --fail --location --retry 3 "${{ matrix.url }}" --output $zip
          if ($LASTEXITCODE -ne 0) {
              throw "Interpreter download failed with exit code $LASTEXITCODE."
          }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
              throw "AutoHotkey64.exe was not found."
          }
          "AHK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build alpha interpreter
        if: matrix.mode == 'build'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
              throw "MSBuild was not found."
          }
          & $msbuild "autohotkey-src\AutoHotkeyx.sln" /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }
          $exe = Resolve-Path "autohotkey-src\bin\AutoHotkey64.exe"
          "AHK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "source_commit=$(git -C autohotkey-src rev-parse HEAD)"

      - name: Execute and verify scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $transcript = "transcript-${{ matrix.label }}.txt"
          "target=${{ matrix.label }}" | Set-Content -Path $transcript -Encoding utf8

          $expected = @{}
          $expected["ReactiveEngine.ahk"] = @(
              "initial=180.00",
              "after_batch=324.00",
              "after_discount=288.00",
              "notification_count=3",
              "total=288.00",
              "cycle_detected=1"
          )
          $expected["LazyQueryPipeline.ahk"] = @(
              "pipeline=9,45,126,270,495",
              "source_produced=15",
              "distinct_slice=2,3,4",
              "descending=10,8,6,4,2"
          )

          $scriptNames = @("LazyQueryPipeline.ahk", "ReactiveEngine.ahk")
          foreach ($scriptName in $scriptNames) {
              $script = Get-Item "harness\research\advanced_patterns\$scriptName"
              "=== $scriptName ===" | Tee-Object -FilePath $transcript -Append
              $output = @(& $env:AHK_EXE /ErrorStdOut $script.FullName 2>&1 | ForEach-Object { $_.ToString() })
              $exitCode = $LASTEXITCODE
              $output | Tee-Object -FilePath $transcript -Append
              "exit_code=$exitCode" | Tee-Object -FilePath $transcript -Append

              if ($exitCode -ne 0) {
                  throw "$scriptName exited with code $exitCode."
              }

              foreach ($line in $expected[$scriptName]) {
                  if ($output -notcontains $line) {
                      throw "$scriptName did not emit expected line '$line'."
                  }
              }
          }

          "Both advanced scripts matched expected output on ${{ matrix.label }}." | Tee-Object -FilePath $transcript -Append

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-patterns-${{ matrix.label }}
          path: transcript-${{ matrix.label }}.txt
          if-no-files-found: warn
